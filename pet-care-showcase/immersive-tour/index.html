<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="PetService 宠物养护管理系统的 Web 3D 沉浸式数字孪生导览页面。"
    />
    <title>PetService 沉浸式宠物养护中心</title>
    <link rel="stylesheet" href="./styles.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "./node_modules/three/build/three.module.js",
          "three/addons/": "./node_modules/three/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <a class="skip-link" href="#tour-hud">跳到导览信息</a>

    <div id="loading-screen" class="loading-screen" aria-live="polite">
      <div class="loading-shell">
        <div class="brand-lockup" aria-label="PetService">
          <svg class="brand-mark" viewBox="0 0 64 64" role="img" aria-labelledby="brand-title">
            <title id="brand-title">PetService 标识</title>
            <path
              d="M32 7c10.7 0 19.4 8.3 20 18.8.5 9.6-5.8 18-14.5 20.7l-3.1 8.2a2.6 2.6 0 0 1-4.8 0l-3.1-8.2C17.8 43.8 11.5 35.4 12 25.8 12.6 15.3 21.3 7 32 7Z"
              fill="none"
              stroke="currentColor"
              stroke-width="3.6"
            />
            <path
              d="M24.2 25.3c1.8-2.1 4.8-2.6 7.8.6 3-3.2 6-2.7 7.8-.6 2 2.4 1.3 6.4-1.8 9.3-1.9 1.8-4.1 3.1-6 4.2-1.9-1.1-4.1-2.4-6-4.2-3.1-2.9-3.8-6.9-1.8-9.3Z"
              fill="currentColor"
            />
          </svg>
          <div>
            <p class="brand-kicker">PetService Digital Twin</p>
            <h1>宠物养护中心沉浸式导览</h1>
          </div>
        </div>

        <div class="loading-meter" aria-label="资源加载进度">
          <div class="loading-percent" id="loading-percent">0%</div>
          <div class="loading-track">
            <div class="loading-bar" id="loading-bar"></div>
          </div>
          <p class="loading-stage" id="loading-stage">加载环境模型</p>
        </div>

        <ol class="loading-steps" aria-label="加载阶段">
          <li data-stage="0">加载环境模型</li>
          <li data-stage="35">加载建筑结构</li>
          <li data-stage="60">加载宠物设施</li>
          <li data-stage="90">初始化空间</li>
        </ol>
      </div>
    </div>

    <main class="tour-app" aria-label="PetService 沉浸式 3D 导览">
      <div class="scene-shell" aria-hidden="true">
        <canvas id="webgl-canvas"></canvas>
        <div class="cinema-vignette"></div>
      </div>

      <section id="tour-hud" class="hud" aria-label="空间导览信息">
        <div class="hud__panel hud__panel--primary">
          <p class="hud__label">当前空间</p>
          <h2 id="hud-area">入口大厅</h2>
          <p id="hud-description">
            从接待、洗护、寄养、医疗到商品与员工调度，沿着空间路径查看宠物养护中心。
          </p>
          <div class="hud__progress" aria-label="导览进度">
            <span id="hud-progress-text">0%</span>
            <div class="hud__progress-track">
              <div id="hud-progress-bar" class="hud__progress-bar"></div>
            </div>
          </div>
        </div>

        <div class="hud__panel hud__panel--metrics" aria-label="运营数据">
          <div>
            <span class="metric-label">服务能力</span>
            <strong id="hud-capacity">80只/日</strong>
          </div>
          <div>
            <span class="metric-label">当前设备</span>
            <strong id="hud-devices">36台</strong>
          </div>
          <div>
            <span class="metric-label">人员协同</span>
            <strong id="hud-staff">18人</strong>
          </div>
        </div>
      </section>

      <nav class="space-nav" aria-label="空间导航"></nav>

      <aside id="hotspot-panel" class="hotspot-panel" aria-live="polite" aria-hidden="true">
        <button class="hotspot-panel__close" type="button" aria-label="关闭热点信息">
          <span></span>
          <span></span>
        </button>
        <p class="hotspot-panel__eyebrow">设施热点</p>
        <h3 id="hotspot-title">智能宠物洗护舱</h3>
        <dl>
          <div>
            <dt>功能</dt>
            <dd id="hotspot-function">自动清洁、烘干、健康检测</dd>
          </div>
          <div>
            <dt>数据</dt>
            <dd id="hotspot-data">每日服务20只宠物</dd>
          </div>
        </dl>
      </aside>

      <button class="intro-skip" id="intro-skip" type="button">跳过片头</button>

      <div class="quality-pill" id="quality-pill" aria-live="polite">质量模式：自动</div>

      <div class="tour-scroll" aria-hidden="true">
        <div class="tour-scroll__spacer"></div>
      </div>
    </main>

    <noscript>
      <p class="noscript">需要启用 JavaScript 才能查看 Web 3D 数字孪生导览。</p>
    </noscript>

    <script>
      window.__PET_CARE_BOOT_STATUS__ = { started: false };
      window.setTimeout(function () {
        if (window.__PET_CARE_BOOT_STATUS__.started) return;

        var stage = document.getElementById("loading-stage");
        var percent = document.getElementById("loading-percent");
        var bar = document.getElementById("loading-bar");
        if (percent) percent.textContent = "0%";
        if (bar) bar.style.width = "0%";
        if (stage) {
          stage.textContent = window.location.protocol === "file:"
            ? "请通过 npm run serve 打开 http://127.0.0.1:4177/"
            : "3D 引擎启动较慢，正在重试资源加载";
        }
      }, 3500);
    </script>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
