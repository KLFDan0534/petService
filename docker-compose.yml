name: petservice

# ============================================================
# 本地开发编排：只跑基础设施，不含任何前端
#
# 前端：vite dev server（frontend/，:5173，/api 与 /minio 已配代理）
# 后端：Spring Boot（IDEA 里跑，:8080）
# 两者都在宿主机上，不进容器。
#
# 启动：docker compose up -d
# 停止：docker compose stop
# 移除：docker compose down        （加 -v 会删数据卷，慎用）
#
# 需要跑「构建后的前端 + nginx」时，用独立的 docker-compose.web.yml：
#   docker compose -f docker-compose.web.yml up -d
# 它是另一个 compose 项目（petservice-web），可以单独启停。
# ============================================================

services:
  mysql:
    image: mysql:8.0
    container_name: pet-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: pet_service
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    ports:
      - "3308:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./pet-admin/src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pet-network

  redis:
    image: redis:7
    container_name: pet-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pet-network

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: pet-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pet-network

  minio:
    # NOTE: 上游 minio/minio 已归档下架（官方镜像/二进制停止分发），改用同源 MinIO 的可用镜像
    image: cgr.dev/chainguard/minio:latest
    container_name: pet-minio
    user: "0:0"  # 原数据卷文件属主为 root，需以 root 运行否则报 file access denied
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "/usr/bin/mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pet-network

  chroma:
    image: chromadb/chroma:latest
    container_name: pet-chroma
    environment:
      IS_PERSISTENT: "TRUE"
      PERSIST_DIRECTORY: /chroma-data
    ports:
      - "8000:8000"
    volumes:
      - chroma-data:/chroma-data
    networks:
      - pet-network

volumes:
  mysql-data:
    name: petservice_mysql_manual_copy_20260708-135648
  redis-data:
    name: petservice_redis-data
  rabbitmq-data:
    name: petservice_rabbitmq-data
  minio-data:
    name: petservice_minio-data
  chroma-data:
    name: petservice_chroma-data

networks:
  pet-network:
    name: petservice_pet-network
    driver: bridge
