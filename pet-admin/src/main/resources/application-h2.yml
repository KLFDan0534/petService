spring:
  autoconfigure:
    exclude:
      - org.springframework.ai.autoconfigure.openai.OpenAiAutoConfiguration
  datasource:
    url: jdbc:h2:file:./data/pet_service;MODE=MYSQL;NON_KEYWORDS=USER
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:h2-schema.sql, classpath:db/seed.sql
      encoding: UTF-8
  h2:
    console:
      enabled: true
      path: /h2-console
  data:
    redis:
      host: localhost
      port: 6379
  rabbitmq:
    host: localhost
    port: 5672

logging:
  file:
    name: logs/pet-service.log
  level:
    com.pet: DEBUG

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

ai:
  deepseek:
    api-key: ${DEEPSEEK_API_KEY:}
    model: ${DEEPSEEK_MODEL:deepseek-v4-flash}
    endpoint: ${DEEPSEEK_ENDPOINT:https://api.deepseek.com}
    max-tokens: ${DEEPSEEK_MAX_TOKENS:8192}
    temperature: ${DEEPSEEK_TEMPERATURE:0.7}
    thinking-type: ${DEEPSEEK_THINKING_TYPE:disabled}

gao:
  map:
    api-key: ${GAO_MAP_API_KEY:}
    security-code: ${GAO_MAP_SECURITY_CODE:}
    handover-radius-meters: ${GAO_MAP_HANDOVER_RADIUS_METERS:500}
    attendance-radius-meters: ${GAO_MAP_ATTENDANCE_RADIUS_METERS:300}
