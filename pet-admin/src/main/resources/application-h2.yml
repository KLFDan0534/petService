spring:
  autoconfigure:
    exclude:
      - org.springframework.ai.autoconfigure.openai.OpenAiAutoConfiguration
  datasource:
    url: jdbc:h2:file:./data/pet_service;MODE=MYSQL;NON_KEYWORDS=USER
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:h2-schema.sql, classpath:db/seed.sql
      encoding: UTF-8
  h2:
    console:
      enabled: true
      path: /h2-console
  data:
    redis:
      host: localhost
      port: 6379
  rabbitmq:
    host: localhost
    port: 5672

logging:
  file:
    name: logs/pet-service.log
  level:
    com.pet: DEBUG

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

ai:
  deepseek:
    api-key: ${ZHIPU_API_KEY:ff49794d56204c31a281c695b97d4875.t5t1ymE6wUwY4gHa}
    model: ${ZHIPU_MODEL:glm-4.7-flash}
    endpoint: ${ZHIPU_ENDPOINT:https://open.bigmodel.cn/api/paas/v4}
    max-tokens: ${ZHIPU_MAX_TOKENS:65536}
    temperature: ${ZHIPU_TEMPERATURE:1.0}
    thinking-type: ${ZHIPU_THINKING_TYPE:disabled}
  kenari:
    api-key: ${KENARI_API_KEY:ff49794d56204c31a281c695b97d4875.t5t1ymE6wUwY4gHa}
    model: ${KENARI_MODEL:glm-4.7-flash}
    endpoint: ${KENARI_ENDPOINT:https://open.bigmodel.cn/api/paas/v4}
    max-tokens: ${KENARI_MAX_TOKENS:65536}
    temperature: ${KENARI_TEMPERATURE:1.0}

gao:
  map:
    api-key: ${GAO_MAP_API_KEY:}
    security-code: ${GAO_MAP_SECURITY_CODE:}
    handover-radius-meters: ${GAO_MAP_HANDOVER_RADIUS_METERS:500}
    attendance-radius-meters: ${GAO_MAP_ATTENDANCE_RADIUS_METERS:300}
