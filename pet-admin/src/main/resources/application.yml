# 服务器配置
server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

# Spring 配置
spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: pet-service
  web:
    resources:
      add-mappings: false
  security:
    user:
      name: admin
      password: ${SPRING_SECURITY_PASSWORD:}
  autoconfigure:
    exclude:
      - org.springframework.ai.autoconfigure.openai.OpenAiAutoConfiguration

# 数据源配置
  sql:
    init:
      mode: never

  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3308/pet_service?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true&sessionVariables=character_set_client=utf8mb4,character_set_connection=utf8mb4,character_set_results=utf8mb4}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    virtual-host: /
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 1

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: false
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted_wsh
      logic-delete-value: 1
      logic-not-delete-value: 0

minio:
  endpoint: http://localhost:9000
  public-url: /minio
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: pet-service

product-media:
  max-count: 10
  max-bytes: 10485760
  max-dimension: 4096

app:
  migration:
    product-media-version: v6_service_product_media

jwt:
  access-token-expiration: 86400000
  refresh-token-expiration: 604800000
  # 开发/本地兜底密钥（384bit 随机 Base64，仅供开发测试）
  # 生产环境务必用环境变量 JWT_SECRET 覆盖，且不要提交真实密钥到仓库
  secret: ${JWT_SECRET:0flNBn7ERj7uWG4a3B5nrnGrB/URisxq1XCQlFJ2uOWpl2zHnjlLkn/DvQCpOfgK}

# Cloudflare Turnstile 人机校验
turnstile:
  secret: ${TURNSTILE_SECRET:}
  allowed-hostnames: ${TURNSTILE_HOSTNAMES:localhost,127.0.0.1}

logging:
  file:
    name: logs/pet-service.log
  level:
    com.pet: DEBUG

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    doc-expansion: none
    default-models-expand-depth: -1
  cache:
    disabled: false
  show-actuator: false

ai:
  deepseek:
    api-key: ${ZHIPU_API_KEY:}
    model: ${ZHIPU_MODEL:glm-5.3-flash}
    endpoint: ${ZHIPU_ENDPOINT:https://api.b.ai/v1}
    max-tokens: ${ZHIPU_MAX_TOKENS:8192}
    temperature: ${ZHIPU_TEMPERATURE:1.0}
    thinking-type: ${ZHIPU_THINKING_TYPE:disabled}
  kenari:
    api-key: ${KENARI_API_KEY:}
    model: ${KENARI_MODEL:glm-5.3-flash}
    endpoint: ${KENARI_ENDPOINT:https://api.b.ai/v1}
    max-tokens: ${KENARI_MAX_TOKENS:8192}
    temperature: ${KENARI_TEMPERATURE:1.0}

chroma:
  url: ${CHROMA_URL:http://localhost:8000}
  tenant: ${CHROMA_TENANT:default_tenant}
  database: ${CHROMA_DATABASE:default_database}

gao:
  map:
    api-key: ${GAO_MAP_API_KEY:}
    security-code: ${GAO_MAP_SECURITY_CODE:}
    handover-radius-meters: ${GAO_MAP_HANDOVER_RADIUS_METERS:500}
    attendance-radius-meters: ${GAO_MAP_ATTENDANCE_RADIUS_METERS:300}

booking:
  slot-minutes: ${BOOKING_SLOT_MINUTES:30}
  max-booking-days: ${BOOKING_MAX_BOOKING_DAYS:91}
  max-order-days: ${BOOKING_MAX_ORDER_DAYS:365}
