spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
      - org.springframework.ai.autoconfigure.openai.OpenAiAutoConfiguration
  datasource:
    url: jdbc:h2:mem:pet_service;DB_CLOSE_DELAY=-1;MODE=MYSQL;NON_KEYWORDS=USER
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:h2-schema.sql
      encoding: UTF-8

minio:
  endpoint: http://127.0.0.1:9001
  access-key: minioadmin
  secret-key: minio123456
  bucket: pet-service

jwt:
  access-token-expiration: 86400000
  refresh-token-expiration: 604800000
  secret: YTJkM2Y1ZjdhOGI5YzBlMWQ0ZjVnNmE3YjhkOWMwZTFkNGY1ZjZhN2I4ZDljMGUxZDRmNWY2YTdiOGQ5YzBlMQ==

gao:
  map:
    api-key: test-gao-map-key
    handover-radius-meters: 500
